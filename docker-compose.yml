version: "3.8"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: diary_user
      POSTGRES_PASSWORD: diary_pass
      POSTGRES_DB: diary_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    build: .
    ports:
      - "8000:8000"
    depends_on:
      - db
    volumes:
      - .:/app
    environment:
      PYTHONUNBUFFERED: "1"
      DATABASE_URL: postgresql://diary_user:diary_pass@db:5432/diary_db

volumes:
  postgres_data:
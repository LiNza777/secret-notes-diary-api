name: Async API CI

on:
  push:
    branches: [ "feature/async-refactoring" ]
  pull_request:
    branches: [ "feature/async-refactoring" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Чеккаут кода
        uses: actions/checkout@v4

      - name: Установка Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Проверка линтером Ruff
        run: ruff check .

      - name: Проверка форматирования Ruff
        run: ruff format --check .

      - name: Запуск тестов через Pytest
        env:
          SECRET_KEY: "test_secret_key_for_ci_environment"
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"
          OPENROUTER_API_KEY: "dummy_key_for_ci_environment"
        run: |
          pytest -v
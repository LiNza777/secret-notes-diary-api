[tool.ruff]
# Длина строки (стандарт PEP 8 или Black — 88 символов)
line-length = 88
target-version = "py310"

# Игнорировать автосгенерированные файлы Alembic
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Выбираем правила:
# E/W — стандартные ошибки и предупреждения pycodestyle (PEP8)
# F — ошибки Pyflakes (неиспользуемые переменные/импорты)
# I — сортировка импортов (isort)
# B — проверка на частые баги (flake8-bugbear)
# UP — предложения по обновлению синтаксиса на современный Python (pyupgrade)
select = ["E", "W", "F", "I", "B", "UP"]

# B008 — разрешает Depends() в аргументах FastAPI
# E501 — опускаем строгость по длине строк для докстрингов и комментов
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"auth.py" = ["B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
[tool.ruff]
# Line length (PEP 8 or Black standard - 88 chars)
line-length = 88
target-version = "py310"

# Ignore autogenerated Alembic files
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
# Select rules:
# E/W - pycodestyle
# F - Pyflakes
# I - isort
# B - flake8-bugbear
# UP - pyupgrade
select = ["E", "W", "F", "I", "B", "UP"]

# B008 - allow Depends() in FastAPI
# E501 - relax line length for docstrings/comments
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"auth.py" = ["B904"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"